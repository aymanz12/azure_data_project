services:

  metabase:
    image: metabase/metabase:latest
    container_name: banking_metabase
    hostname: banking_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_NAME: "Banking Analytics"
      MB_SITE_LOCALE: en
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    volumes:
      - metabase_data:/metabase-data
      - ../superset/banking.db:/data/banking.db:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  metabase_data:
